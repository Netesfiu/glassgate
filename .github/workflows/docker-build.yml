name: Docker Build and Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- 1) Építés + füstteszt (push előtt, hogy hibás image ne kerüljön fel) ---
      - name: Build production image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          load: true
          tags: glassgate:smoke
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod

      - name: Smoke test (healthz, QR generálás, nem-PDF elutasítás)
        run: |
          set -euxo pipefail
          docker run -d --name gg-smoke -p 3000:3000 glassgate:smoke
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/healthz >/dev/null && break; sleep 1; done
          curl -s http://127.0.0.1:3000/healthz
          curl -sf -H 'Content-Type: application/json' -d '{"text":"SMOKE-TEST"}' http://127.0.0.1:3000/generate | head -c 60; echo
          printf 'nem pdf tartalom\n' > /tmp/notpdf.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' -F "pdf=@/tmp/notpdf.txt" http://127.0.0.1:3000/process-pdf)" = "415"
          docker inspect --format 'health={{.State.Health.Status}}' gg-smoke
          docker rm -f gg-smoke

      # --- 2) GHCR: elsődleges registry (a NAS erről húz, nincs Docker Hub rate limit) ---
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/netesfiu/glassgate:latest
            ghcr.io/netesfiu/glassgate:${{ github.sha }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod

      - name: Build and push development image (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.dev
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/netesfiu/glassgate:dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      # --- 3) Docker Hub: megtartva, de nem blokkoló (a régi secret-ek lejárhattak) ---
      - name: Login to Docker Hub
        id: dockerhub_login
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image (Docker Hub)
        if: github.event_name != 'pull_request' && steps.dockerhub_login.outcome == 'success'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            netesfiu/glassgate:latest
            netesfiu/glassgate:${{ github.sha }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod
